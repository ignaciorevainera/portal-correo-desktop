<!DOCTYPE html>
<html lang="es" class="dark">

    <meta charset="UTF-8" />

    <title>Monitor de ping</title>
    <script>
      try {

        document.documentElement.classList.toggle("dark", theme === "dark");

  <body class="bg-card text-foreground antialiased select-none overflow-hidden">
    <div id="root"></div>
